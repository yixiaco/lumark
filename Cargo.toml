[workspace]
resolver = "2"
members = [
    "crates/lumark-archive",
    "crates/lumark-browser",
    "crates/lumark-settings",
    "crates/lumark-mail",
    "crates/lumark-sfx",
    "crates/lumark-tasks",
    "crates/lumark-ui",
    "crates/lumark-vault",
    "crates/lumark-app",
    "crates/lumark-platform-windows",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96"

[workspace.dependencies]
aes-gcm = "0.10.3"
anyhow = "1"
argon2 = "0.5.3"
base64 = "0.22"
blake3 = "1"
brotli = "8"
bzip2 = "0.6"
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
crc32fast = "1.5"
dirs = "7"
encoding_rs = "0.8"
filetime = "0.2"
flate2 = { version = "1.1", default-features = false, features = ["zlib-ng"] }
globset = "0.4"
gpui-kit = "=0.7.3"
geezipx-core = "0.7.4"
image = { version = "0.25.10", default-features = false, features = ["png"] }
libc = "0.2"
msi = "0.10"
cab = "0.6"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }
lz4_flex = { version = "0.13", features = ["frame"] }
lzma-rust2 = { version = "0.22", default-features = false, features = ["std", "encoder", "lzip"] }
oxiarc-lzhuf = "0.3.6"
natord = "1"
parking_lot = "0.12"
quick-xml = "0.41"
rand = "0.8"
rayon = "1.12"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust2 = { version = "=0.24.1", default-features = false, features = ["compress", "aes256", "bzip2", "ppmd", "deflate", "util"] }
sha2 = "0.10"
sysinfo = "0.33"
tar = "0.4"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
unrar = "0.5.8"
unarc-rs = "0.6.3"
unalz = "0.2.1"
walkdir = "2.5"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56"
xz2 = { version = "0.1", features = ["static"] }
zeroize = { version = "1.9", features = ["derive"] }
zip = { version = "=9.0.5", default-features = false, features = ["aes-crypto", "deflate-flate2", "deflate64", "legacy-zip", "bzip2", "ppmd", "time", "chrono", "xz", "zstd", "lzma"] }
zpaq_rs = "=1.0.4"
zstd = "0.14"
