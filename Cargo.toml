[workspace]
resolver = "2"
members = [
    "crates/lumark-archive",
    "crates/lumark-legacy",
    "crates/lumark-browser",
    "crates/lumark-settings",
    "crates/lumark-mail",
    "crates/lumark-sfx",
    "crates/lumark-tasks",
    "crates/lumark-ui",
    "crates/lumark-ui-shared",
    "crates/lumark-unreal",
    "crates/lumark-scene",
    "crates/lumark-render",
    "crates/lumark-export",
    "crates/lumark-viewer",
    "crates/lumark-media",
    "crates/lumark-vault",
    "crates/lumark-app",
    "crates/lumark-platform-windows",
    "vendor/zpaq_rs",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96"

[workspace.dependencies]
aes = "0.8"
aes-gcm = "0.10.3"
anyhow = "1"
argon2 = "0.5.3"
base64 = "0.22"
blake3 = "1"
brotli = "8"
bzip3-rs = "=1.0.1"
snap = "1.1.2"
bzip2 = "0.6"
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
crc32fast = "1.5"
dirs = "7"
encoding_rs = "0.8"
enc_file = "0.6.6"
filetime = "0.2"
flate2 = { version = "1.1", default-features = false, features = ["zlib-ng"] }
globset = "0.4"
gpui-kit = "=0.8.1"
rust-i18n = "4.2"
lumark-legacy = { path = "crates/lumark-legacy" }
lumark-unreal = { path = "crates/lumark-unreal" }
lumark-scene = { path = "crates/lumark-scene" }
lumark-render = { path = "crates/lumark-render" }
lumark-export = { path = "crates/lumark-export" }
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
    "ico",
    "pnm",
] }
libc = "0.2"
libchm = "0.3"
nsis = "0.6"
unegg = "0.2"
dpp = "0.6"
hfsplus = "0.4"
udif = "0.4.2"
backhand = { version = "0.25", default-features = false, features = ["gzip", "zstd", "lz4", "xz", "xz-static"] }
msi = "0.10"
cab = "0.6"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }
memchr = "2.7"
memmap2 = "0.9"
lz4_flex = { version = "0.13", features = ["frame"] }

lzma-rust2 = { version = "0.22", default-features = false, features = ["std", "encoder", "lzip"] }
oxiarc-core = "0.3.6"
oxiarc-lzhuf = "0.3.6"
oozextract = "0.5.7"
natord = "1"
parking_lot = "0.12"
pollster = "0.4"
quick-xml = "0.41"
rand = "0.8"
rayon = "1.12"
regex = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
wgpu = "30.0.1"
serde_json = "1"
sevenz-rust2 = { version = "=0.24.1", default-features = false, features = ["compress", "aes256", "bzip2", "ppmd", "deflate", "util"] }
sha1 = "0.10"
sha2 = "0.10"
wim = "0.1.3"
wim-format = "0.1.1"
sysinfo = "0.33"
tar = "0.4"
tempfile = "3"
thiserror = "2"
texture2ddecoder = "0.1.2"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
unrar = "0.5.8"
unarc-rs = "0.6.3"
unalz = "0.2.1"
walkdir = "2.5"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56"
zeroize = { version = "1.9", features = ["derive"] }
zip = { version = "=9.0.5", default-features = false, features = ["aes-crypto", "deflate-flate2", "deflate64", "legacy-zip", "bzip2", "ppmd", "time", "chrono", "xz", "zstd", "lzma"] }
zpaq_rs = "=1.0.4"
zstd = "0.14"

[patch.crates-io]
libazo = { path = "vendor/libazo" }
xz2 = { path = "vendor/xz2" }
zpaq_rs = { path = "vendor/zpaq_rs" }
wim = { path = "vendor/wim" }

# 工作区测试二进制包含大量 UI/渲染依赖；完整 debug 信息会让 MSVC link.exe
# 单个进程峰值超过 5 GiB。这里保留工作区代码的行号表、去掉第三方依赖的
# 完整调试信息，显著降低链接内存和 PDB 体积。
[profile.dev]
debug = 1
# 增量缓存默认关闭：rustc 按 target/debug/incremental/<crate>-<哈希> 建目录，
# 编译参数（feature、目标集合、工具链、profile）一变化就另建一份，旧目录不会
# 回收，本仓库曾累积到 434 个目录、约 12 GB。膨胀主要来自测试和示例目标——
# 每个 tests/*.rs、examples/*.rs 都是独立 crate 单元（lumark-archive 有 25 个
# 测试、lumark-unreal 有 53 个示例）。因此 dev/test 两个 profile 都先关闭，
# 只给下方列出的高频 crate 单独打开；需要一次性全量增量缓存时用
# `$env:CARGO_INCREMENTAL = 1` 临时覆盖本设置。
incremental = false

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1
# 测试目标数量多，是缓存目录膨胀的大头，test profile 保持整体关闭。
incremental = false

[profile.test.package."*"]
debug = 0

# 增量缓存只留给近 90 天提交里改动最频繁、单次重编最贵的 crate：
# lumark-ui(1030)、lumark-archive(439)、lumark-unreal(224) 为改动文件数前三，
# lumark-render(57) 是当前迭代热点。热点迁移时在这里增删条目；dev 与 test
# 是两个独立 profile，需要按目标分别声明。
[profile.dev.package.lumark-ui]
incremental = true

[profile.dev.package.lumark-archive]
incremental = true

[profile.dev.package.lumark-unreal]
incremental = true

[profile.dev.package.lumark-render]
incremental = true

# 测试 profile 只给集成测试目标很少、单测全在 lib 内部的两个 crate 打开，
# 避免 archive/unreal 的测试与示例各留一份缓存。
[profile.test.package.lumark-ui]
incremental = true

[profile.test.package.lumark-render]
incremental = true
