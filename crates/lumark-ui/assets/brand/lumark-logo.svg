<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1422"/>
      <stop offset="100%" stop-color="#040910"/>
    </linearGradient>
    <linearGradient id="hexFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16283f"/>
      <stop offset="100%" stop-color="#0a1522"/>
    </linearGradient>
    <linearGradient id="hexEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ad1ff"/>
      <stop offset="100%" stop-color="#0277bd"/>
    </linearGradient>
    <linearGradient id="zipFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#0277bd"/>
    </linearGradient>
    <linearGradient id="zipLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b0bec5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 圆角方形背景 -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- 背景装饰光晕 -->
  <circle cx="256" cy="250" r="190" fill="#4fc3f7" opacity="0.04"/>

  <!-- 外六边形徽章 -->
  <g filter="url(#shadow)">
    <polygon points="256,64 420,158 420,346 256,440 92,346 92,158"
             fill="url(#hexFill)" stroke="url(#hexEdge)" stroke-width="4"/>
  </g>

  <!-- 内六边形细线 -->
  <polygon points="256,92 396,172 396,332 256,412 116,332 116,172"
           fill="none" stroke="#4fc3f7" stroke-width="1" opacity="0.2"/>

  <!-- 六边形顶点拉链齿装饰 -->
  <g fill="#5ad1ff" opacity="0.55">
    <circle cx="256" cy="64" r="4"/>
    <circle cx="420" cy="158" r="4"/>
    <circle cx="420" cy="346" r="4"/>
    <circle cx="256" cy="440" r="4"/>
    <circle cx="92" cy="346" r="4"/>
    <circle cx="92" cy="158" r="4"/>
  </g>

  <!-- 中央压缩包 -->
  <g filter="url(#shadow)">
    <rect x="186" y="186" width="140" height="140" rx="24" fill="url(#zipFill)"/>
    <rect x="186" y="186" width="140" height="140" rx="24" fill="#ffffff" opacity="0.1"/>
  </g>

  <!-- 压缩包顶部高光 -->
  <rect x="202" y="198" width="108" height="8" rx="4" fill="#ffffff" opacity="0.2"/>

  <!-- 压缩包折角 -->
  <path d="M326 186 L326 226 L286 186 Z" fill="#ffffff" opacity="0.15"/>

  <!-- 中央拉链虚线 -->
  <line x1="256" y1="204" x2="256" y2="298" stroke="url(#zipLine)" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 7"/>

  <!-- 拉链头 -->
  <g filter="url(#glow)">
    <rect x="246" y="284" width="20" height="14" rx="4" fill="#ffffff" opacity="0.95"/>
    <rect x="250" y="298" width="12" height="10" rx="3" fill="#ffffff" opacity="0.75"/>
  </g>

  <!-- 底部品牌字 -->
  <text x="256" y="476" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="12" opacity="0.85">LUMARK</text>
</svg>