<!-- Lumark 品牌标志：透明背景，保留完整字标，用于关于页和安装资源。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="hexEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ad1ff"/>
      <stop offset="100%" stop-color="#0277bd"/>
    </linearGradient>
    <linearGradient id="zipFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#0277bd"/>
    </linearGradient>
    <linearGradient id="zipLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b0bec5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 透明背景 -->

  <!-- 外六边形：只保留蓝色描边，无深色填充 -->
  <g filter="url(#shadow)">
    <polygon points="256,56 424,152 424,344 256,440 88,344 88,152"
             fill="none" stroke="url(#hexEdge)" stroke-width="16" stroke-linejoin="round"/>
  </g>

  <!-- 内六边形细线 -->
  <polygon points="256,86 396,168 396,328 256,410 116,328 116,168"
           fill="none" stroke="#4fc3f7" stroke-width="1.5" opacity="0.35"/>

  <!-- 六边形顶点拉链齿装饰 -->
  <g fill="#5ad1ff" opacity="0.7">
    <circle cx="256" cy="56" r="5"/>
    <circle cx="424" cy="152" r="5"/>
    <circle cx="424" cy="344" r="5"/>
    <circle cx="256" cy="440" r="5"/>
    <circle cx="88" cy="344" r="5"/>
    <circle cx="88" cy="152" r="5"/>
  </g>

  <!-- 中央压缩包 -->
  <g filter="url(#shadow)">
    <rect x="150" y="150" width="212" height="212" rx="34" fill="url(#zipFill)"/>
    <rect x="150" y="150" width="212" height="212" rx="34" fill="#ffffff" opacity="0.12"/>
  </g>

  <!-- 压缩包顶部高光 -->
  <rect x="172" y="166" width="168" height="12" rx="6" fill="#ffffff" opacity="0.22"/>

  <!-- 压缩包折角 -->
  <path d="M362 150 L362 208 L304 150 Z" fill="#ffffff" opacity="0.18"/>

  <!-- 中央拉链虚线 -->
  <line x1="256" y1="180" x2="256" y2="314" stroke="url(#zipLine)" stroke-width="8" stroke-linecap="round" stroke-dasharray="12 11"/>

  <!-- 拉链头 -->
  <g filter="url(#glow)">
    <rect x="242" y="300" width="28" height="20" rx="6" fill="#ffffff" opacity="0.95"/>
    <rect x="248" y="320" width="16" height="14" rx="4" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- 底部品牌字 -->
  <text x="256" y="486" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#5ad1ff" text-anchor="middle" letter-spacing="12" opacity="0.9">LUMARK</text>
</svg>